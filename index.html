<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>WeLIVE Fullscreen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div id="app">
        <header>
            <h1>WeLIVE:我們來接你了ㄛ</h1>
            <div id="currentIdentity" class="hidden">
                <button id="startPollBtn" title="發起投票" aria-label="發起投票">
                    <!-- hand SVG icon -->
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">
                        <path
                            d="M8 2v10M12 2v10M16 2v10M4 12h16a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2v-6a2 2 0 012-2z"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <button id="shareScreenBtn" title="分享螢幕" aria-label="分享螢幕">
                    <!-- simple screen SVG icon -->
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">
                        <rect x="3" y="4" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.5"
                            fill="none"></rect>
                        <path d="M8 20h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                        <path d="M12 16v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                </button>
                <button id="recordScreenBtn" title="錄製螢幕" aria-label="錄製螢幕">
                    <!-- record circle SVG icon -->
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"></circle>
                        <circle cx="12" cy="12" r="4" fill="currentColor"></circle>
                    </svg>
                </button>
                <span id="recordingIndicator" style="display:none; color:red; font-weight:bold; margin-left:8px;">
                    🔴 錄製中
                </span>
                <span>暱稱：<span id="currentDisplayName"></span></span>
                <button id="changeNameBtn">變更暱稱</button>
            </div>
        </header>

        <main>
            <section id="profileSection">
                <h2>輸入暱稱即可開始直播聊天</h2>
                <form id="profileForm">
                    <input type="text" id="displayNameInput" placeholder="暱稱（顯示在聊天室房間列表）" maxlength="32" required>
                    <button type="submit">開始使用</button>
                </form>
                <p class="hint">不需註冊，只要設定暱稱就能建立或加入房間。</p>
            </section>

            <section id="roomsSection" class="hidden">
                <div class="rooms-header">
                    <h2>房間列表</h2>
                    <form id="createRoomForm">
                        <div class="create-row">
                            <input type="text" id="newRoomName" placeholder="輸入房間名稱" maxlength="48" required>
                            <button type="submit">建立房間</button>
                        </div>
                        <div class="create-row create-options">
                            <div class="mode-toggle" role="radiogroup" aria-label="房間模式">
                                <label title="每個人都開鏡頭互相通話（最多 4 人）">
                                    <input type="radio" name="roomMode" value="call" checked>
                                    <span>💬 視訊通話</span>
                                </label>
                                <label title="只有房主開播，其他人當觀眾（最多 30 人）">
                                    <input type="radio" name="roomMode" value="live">
                                    <span>📺 直播</span>
                                </label>
                            </div>
                            <input type="password" id="newRoomPassword" placeholder="🔒 密碼（選填，留空為公開）" maxlength="32" autocomplete="new-password">
                        </div>
                    </form>
                </div>
                <ul id="roomsList"></ul>
            </section>

            <section id="conferenceSection" class="hidden">
                <div id="conferenceLayout">
                    <aside id="sidebar">
                        <div class="room-title-row">
                            <h3>房間：<span id="roomName"></span></h3>
                            <span id="roomModeBadge" class="mode-badge"></span>
                        </div>
                        <div id="viewerCount" class="viewer-count hidden"></div>
                        <div class="participants-header">
                            <h4>在線成員</h4>
                            <!-- requestSongBtn will be dynamically added here -->
                        </div>
                        <ul id="participantsList"></ul>

                        <div id="controls">
                            <button id="toggleCamera">關閉鏡頭</button>
                            <button id="toggleMic">關閉麥克風</button>
                            <button id="leaveRoomBtn">離開房間</button>
                            <button id="clearPrompterBtn" class="hidden">清除提詞</button>
                        </div>

                        <!-- pollContainer removed from sidebar; floating poll window is rendered separately -->

                        <div class="sidebar-tabs" role="tablist">
                            <button type="button" class="tab-btn active" data-tab="chat" role="tab">聊天</button>
                            <button type="button" class="tab-btn" data-tab="queue" role="tab">點歌佇列 <span id="queueCount" class="tab-count hidden">0</span></button>
                        </div>

                        <div id="chat" class="tab-panel">
                            <div id="messages"></div>
                            <div class="chat-input">
                                <div id="mentionSuggest" class="mention-suggest hidden" role="listbox"></div>
                                <input type="text" id="messageInput" placeholder="輸入訊息，打 @ 可以提及成員..." autocomplete="off">
                                <button id="sendBtn">送出</button>
                            </div>
                            <div class="reactions">
                                <button class="reactionBtn" data-emoji="👏">👏</button>
                                <button class="reactionBtn" data-emoji="🚀">🚀</button>
                                <button id="lyricsBtn" title="搜尋歌詞">🔍</button>
                                <button id="danmakuToggle" class="toggle-chip active" title="彈幕開關" aria-pressed="true">彈</button>
                            </div>
                        </div>

                        <div id="queuePanel" class="tab-panel hidden">
                            <div id="nowPlaying" class="now-playing empty">
                                <div class="np-label">正在演唱</div>
                                <div class="np-title">目前沒有歌曲</div>
                                <div class="np-meta">在下面點一首歌開始吧！</div>
                            </div>
                            <div class="np-controls">
                                <button type="button" id="queueNextBtn" title="切到下一首">⏭ 下一首</button>
                                <button type="button" id="autoScrollBtn" title="歌詞自動捲動">⏸ 暫停捲動</button>
                                <select id="scrollSpeed" title="歌詞捲動速度">
                                    <option value="4500">慢</option>
                                    <option value="3500" selected>中</option>
                                    <option value="2500">快</option>
                                </select>
                            </div>
                            <h4>接下來</h4>
                            <ol id="queueList"></ol>
                            <form id="queueAddForm">
                                <input type="text" id="queueSongInput" placeholder="歌名" maxlength="100" required>
                                <input type="text" id="queueArtistInput" placeholder="歌手（選填）" maxlength="100">
                                <button type="submit">＋ 加入佇列</button>
                            </form>
                        </div>
                    </aside>

                    <div id="stage">
                        <div id="danmakuLayer" aria-hidden="true"></div>
                        <div id="localContainer" class="video-card" data-user="self">
                            <video id="localVideo" autoplay playsinline muted></video>
                            <span class="label">我</span>
                        </div>
                        <!-- 房主視訊會動態插入這裡 -->
                        <div id="remoteGrid" class="members-grid"></div>
                    </div>
                    <!-- 提詞機/預留區塊 -->

                    <div id="prompter" aria-hidden="true"></div>
                </div>
            </section>
        </main>

        <div id="notification" class="hidden"></div>

        <!-- Lyrics search modal (keeps chat area unchanged) -->
        <div id="lyricsModal" class="modal hidden" aria-hidden="true">
            <div class="modal-backdrop"></div>
            <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="lyricsModalTitle">
                <h3 id="lyricsModalTitle">搜尋歌詞</h3>
                <div class="modal-body">
                    <label>歌名<br><input type="text" id="songInput" placeholder="歌名"></label>
                    <label>歌手<br><input type="text" id="artistInput" placeholder="歌手"></label>
                    <div id="lyricsResult" class="lyrics-result hidden" aria-live="polite"></div>
                </div>
                <div class="modal-actions">
                    <button id="searchLyricsBtn">搜尋</button>
                    <button id="cancelLyricsBtn">取消</button>
                </div>
            </div>
        </div>

        <!-- Poll modal -->
        <div id="pollModal" class="modal hidden" aria-hidden="true">
            <div class="modal-backdrop"></div>
            <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="pollModalTitle">
                <h3 id="pollModalTitle">發起投票</h3>
                <div class="modal-body">
                    <label>問題<br><input type="text" id="pollQuestionInput" placeholder="投票問題（必填）"></label>
                    <div class="poll-settings">
                        <label><input type="checkbox" id="pollMultipleChoice"> 可複選</label>
                    </div>
                    <label>選項（每行一個，請在底線處填入）</label>
                    <div class="poll-options-inputs" id="pollOptionsContainer">
                        <div class="poll-option-wrapper">
                            <input type="text" class="poll-option-input" placeholder="________" maxlength="120">
                        </div>
                        <div class="poll-option-wrapper">
                            <input type="text" class="poll-option-input" placeholder="________" maxlength="120">
                        </div>
                        <div class="poll-option-wrapper">
                            <input type="text" class="poll-option-input" placeholder="________" maxlength="120">
                        </div>
                    </div>
                    <button id="addPollOptionBtn" class="add-option-btn">+ 增設選項</button>
                </div>
                <div class="modal-actions">
                    <button id="createPollBtn">送出投票</button>
                    <button id="cancelPollBtn">取消</button>
                </div>
            </div>
        </div>
        <!-- Song request modal -->
        <div id="songRequestModal" class="modal hidden" aria-hidden="true">
            <div class="modal-backdrop"></div>
            <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="songRequestModalTitle">
                <h3 id="songRequestModalTitle">點歌</h3>
                <div class="modal-body">
                    <label>要請誰唱<br><select id="songRequestTarget"></select></label>
                    <label>歌名<br><input type="text" id="requestSongName" placeholder="歌名"></label>
                    <label>歌手<br><input type="text" id="requestSongArtist" placeholder="歌手"></label>
                </div>
                <div class="modal-actions">
                    <button id="confirmSongRequestBtn">發起點歌</button>
                    <button id="cancelSongRequestBtn">取消</button>
                </div>
            </div>
        </div>

        <!-- Song request notification modal -->
        <div id="songRequestNotification" class="modal hidden" aria-hidden="true">
            <div class="modal-backdrop"></div>
            <div class="modal-content song-notification" role="dialog" aria-modal="true">
                <div id="songRequestContent"></div>
                <div class="modal-actions">
                    <button id="acceptSongRequestBtn">確認</button>
                    <button id="rejectSongRequestBtn">拒絕</button>
                </div>
            </div>
        </div>

        <!-- Password modal (private rooms) -->
        <div id="passwordModal" class="modal hidden" aria-hidden="true">
            <div class="modal-backdrop"></div>
            <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="passwordModalTitle">
                <h3 id="passwordModalTitle">🔒 私人房間</h3>
                <div class="modal-body">
                    <p id="passwordModalRoom" class="hint"></p>
                    <input type="password" id="joinPasswordInput" placeholder="請輸入房間密碼" maxlength="32" autocomplete="off">
                    <p id="passwordError" class="form-error hidden"></p>
                </div>
                <div class="modal-actions">
                    <button id="confirmPasswordBtn">加入</button>
                    <button id="cancelPasswordBtn" class="btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <!-- Floating poll window (does not affect layout) -->
        <div id="pollContainer" class="poll-window hidden" aria-live="polite"></div>
    </div>

    <div id="whiteboardModal" class="modal hidden" aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-content whiteboard-content" role="dialog" aria-modal="true">
            <div class="whiteboard-header">
                <h3>互動白板</h3>
                <div class="whiteboard-tools">
                    <button class="color-btn selected" data-color="#000000" style="background:#000;"></button>
                    <button class="color-btn" data-color="#2563eb" style="background:#2563eb;"></button>
                    <button class="color-btn" data-color="#ef4444" style="background:#ef4444;"></button>
                    <button id="clearBoardBtn">清除</button>
                    <button id="closeWhiteboardBtn">關閉</button>
                </div>
            </div>
            <div class="canvas-container">
                <canvas id="whiteboardCanvas"></canvas>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
